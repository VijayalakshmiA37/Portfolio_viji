<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI CSV & Excel App — Demo | Vijayalakshmi</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --accent3: #ec4899;
    --bg: #0a0c18;
    --glass: rgba(15,18,35,0.6);
    --border: rgba(0,212,255,0.2);
    --text: #ffffff;
    --muted: #a8b2c1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* Particle canvas */
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* Back bar */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(10,12,24,0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
    font-size: 0.88rem;
    transition: gap 0.3s;
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'Syne', sans-serif;
  }

  .back-btn:hover { gap: 0.8rem; }

  .topbar-logo {
    font-size: 1.1rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Main content */
  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 960px;
    padding: 110px 2rem 4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 1.2rem;
    border: 1.5px solid var(--border);
    border-radius: 50px;
    background: var(--glass);
    font-size: 0.75rem;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
    backdrop-filter: blur(10px);
    animation: fadeDown 0.7s cubic-bezier(.34,1.56,.64,1) both;
  }

  .badge .dot {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulseDot 2s infinite;
  }

  @keyframes pulseDot {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(1.6); }
  }

  /* Title */
  h1 {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 800;
    text-align: center;
    letter-spacing: -0.5px;
    line-height: 1.2;
    animation: fadeDown 0.7s cubic-bezier(.34,1.56,.64,1) 0.1s both;
  }

  h1 span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    font-size: 1rem;
    text-align: center;
    max-width: 600px;
    line-height: 1.75;
    animation: fadeDown 0.7s cubic-bezier(.34,1.56,.64,1) 0.2s both;
  }

  /* Video container */
  .video-wrapper {
    width: 100%;
    background: #000;
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 40px 80px rgba(0,212,255,0.15), 0 0 0 1px rgba(0,212,255,0.1);
    animation: fadeUp 0.8s cubic-bezier(.34,1.56,.64,1) 0.3s both;
    position: relative;
  }

  .video-wrapper::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    z-index: -1;
    opacity: 0.4;
  }

  video {
    width: 100%;
    display: block;
    border-radius: 14px;
    max-height: 70vh;
    background: #000;
  }

  /* Tags */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
    animation: fadeUp 0.7s cubic-bezier(.34,1.56,.64,1) 0.4s both;
  }

  .tag {
    font-size: 0.72rem;
    padding: 0.45rem 0.9rem;
    background: rgba(0,212,255,0.1);
    color: var(--accent);
    border-radius: 8px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid rgba(0,212,255,0.25);
  }

  /* CTA */
  .cta-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeUp 0.7s cubic-bezier(.34,1.56,.64,1) 0.5s both;
  }

  .btn {
    padding: 0.9rem 2rem;
    font-size: 0.9rem;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.35s cubic-bezier(.34,1.56,.64,1);
    border: none;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 10px 35px rgba(0,212,255,0.3);
  }

  .btn-primary:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 20px 50px rgba(0,212,255,0.5);
  }

  .btn-secondary {
    background: var(--glass);
    color: var(--accent);
    border: 1.5px solid var(--accent);
    backdrop-filter: blur(10px);
  }

  .btn-secondary:hover {
    background: rgba(0,212,255,0.1);
    transform: translateY(-3px);
  }

  @keyframes fadeDown {
    from { opacity:0; transform:translateY(-18px); }
    to { opacity:1; transform:translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(30px); }
    to { opacity:1; transform:translateY(0); }
  }

  @media (max-width: 600px) {
    .page { padding: 90px 1rem 3rem; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="topbar">
  <button class="back-btn" onclick="window.close()">← Back to Portfolio</button>
  <div class="topbar-logo">Vijayalakshmi</div>
</div>

<div class="page">

  <div class="badge"><span class="dot"></span> Live Project Demo</div>

  <h1>AI Web App for <span>CSV & Excel</span> Analysis</h1>

  <p class="subtitle">
    Upload any CSV or Excel file and instantly get AI-powered insights, smart visualizations, and natural language answers — all in one click.
  </p>

  <div class="video-wrapper">
    <video
      controls
      autoplay
      src="ai-chatbot-demo.mp4"
      preload="auto"
    >
      Your browser does not support the video tag.
    </video>
  </div>

  <div class="tags">
    <span class="tag">Python</span>
    <span class="tag">FastAPI</span>
    <span class="tag">React.js</span>
    <span class="tag">AI / ML</span>
    <span class="tag">Pandas</span>
    <span class="tag">Chart.js</span>
  </div>

  <div class="cta-row">
    <a href="https://www.fiverr.com/vijayalakshmia3" target="_blank" class="btn btn-primary">Order on Fiverr ✦</a>
    <button class="btn btn-secondary" onclick="window.close()">← Back to Portfolio</button>
  </div>

</div>

<script>
// Particle background (same as portfolio)
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = Math.random() * 1.6 + 0.4;
    this.speedX = (Math.random() - 0.5) * 0.35;
    this.speedY = (Math.random() - 0.5) * 0.35;
    this.opacity = Math.random() * 0.45 + 0.1;
    const r = Math.random();
    this.color = r > 0.6
      ? `rgba(0,212,255,${this.opacity})`
      : r > 0.3
        ? `rgba(124,58,237,${this.opacity})`
        : `rgba(236,72,153,${this.opacity})`;
    this.pulse = Math.random() * Math.PI * 2;
    this.pulseSpeed = Math.random() * 0.012 + 0.004;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.pulse += this.pulseSpeed;
    if (this.x < -10) this.x = W + 10;
    if (this.x > W + 10) this.x = -10;
    if (this.y < -10) this.y = H + 10;
    if (this.y > H + 10) this.y = -10;
  }
  draw() {
    const s = this.size + Math.sin(this.pulse) * 0.3;
    ctx.beginPath();
    ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
}

const COUNT = Math.min(100, Math.floor(W * H / 10000));
for (let i = 0; i < COUNT; i++) particles.push(new Particle());

function drawLines() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 110) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(0,212,255,${(1 - dist/110) * 0.1})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  drawLines();
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
